# apps/api — FastAPI surface for the Mini-App and external integrations.
# Depends on packages/core for all domain logic; this package is a thin presentation layer.

[project]
name = "smart-accounting-api"
version = "0.1.0"
description = "FastAPI HTTP surface for smart-accounting-hub. Mounted behind Caddy at /api/v1/*."
requires-python = ">=3.12"
dependencies = [
    "smart-accounting",                 # workspace dep — domain models + services
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "dishka>=1.4",                      # DI container; integrated via dishka.integrations.fastapi
    "httpx>=0.27",                      # outbound HTTP for FX rate clients
    "pyjwt>=2.9",                       # HS256 JWT issuance + verification (D12)
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.14",
]

[project.scripts]
# Wired so `uv run smart-accounting-api` boots uvicorn the same way `python -m` would.
# Compose actually invokes uvicorn directly per ops/compose.yml.
smart-accounting-api = "smart_accounting_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_accounting_api"]
