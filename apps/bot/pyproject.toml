# apps/bot — aiogram 3 bot, polling at MVP (D-baseline; webhook is a 1-line config switch later).
# Same Dockerfile, same image, different CMD: `python -m smart_accounting_bot`.

[project]
name = "smart-accounting-bot"
version = "0.1.0"
description = "Telegram bot for smart-accounting-hub. Long-poll, single-replica."
requires-python = ">=3.12"
dependencies = [
    "smart-accounting",                 # workspace dep — domain models + services
    "aiogram>=3.13",
    "aiogram-dialog>=2.2",              # multi-step FSM dialogs (RecordTradeDialog, CreateBookDialog, etc.)
    "dishka>=1.4",                      # DI; integrated via dishka.integrations.aiogram
    "redis>=5.2",                       # FSM storage (D17 baseline)
    "structlog>=24.4",
    "sentry-sdk>=2.14",
]
# Q4-locked architectural rule: the bot calls `smart_accounting.services.*` directly.
# It never makes an HTTP call to apps/api. No httpx dep on purpose.
# CI grep guard in .github/workflows/ci.yml enforces "no models/repositories imports from apps/bot".

[project.scripts]
smart-accounting-bot = "smart_accounting_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_accounting_bot"]
