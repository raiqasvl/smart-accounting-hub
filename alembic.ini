# Alembic configuration — lifted from research/AiogramBotTemplate/alembic.ini and adapted.
# DB URL is overridden at runtime by migrations/env.py reading from smart_accounting.config.
#
# Per plan §1.3 — first migration `2026_05_01_0001_initial.py` creates all 11 tables
# (users, tg_chats, books, book_members, book_invites, currencies, accounts, categories,
# exchange_rates, fx_transactions, notifications_outbox) plus ltree extension and enum types.

[alembic]
script_location = migrations
prepend_sys_path = .

# Date-prefixed revision filenames keep migration history readable in `ls`.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Placeholder; the real DSN is injected by migrations/env.py from pydantic-settings.
sqlalchemy.url = postgresql+asyncpg://CHANGEME

# Run `ruff format` on every newly generated migration so they're stylistically consistent.
[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
